name: 9AM Daily News Summary
on:
  schedule:
    - cron: '0 1 * * *' # This is 9:00 AM in Beijing/Shanghai (UTC+8)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        # Added feedparser here!
        run: pip install google-generativeai requests feedparser 
      - name: Run Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
        run: python main.py
